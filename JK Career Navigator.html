<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JK Career Navigator — Government Counseling Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #20293a;
    background-image: radial-gradient(circle at 30% 20%, #2a3650 0%, #1a2230 60%, #141a26 100%);
    min-height: 100vh;
    font-family: 'Inter', system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; overflow: hidden;
  }
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-weight: normal; font-style: normal; line-height: 1;
    letter-spacing: normal; text-transform: none; display: inline-block;
    white-space: nowrap; word-wrap: normal; direction: ltr;
    font-feature-settings: 'liga' 1; -webkit-font-feature-settings: 'liga' 1;
    -moz-font-feature-settings: 'liga'; font-variation-settings: 'opsz' 24;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  /* Urdu / RTL: swap to a clean Naskh face for legible UI */
  [dir="rtl"] { font-family: 'Noto Naskh Arabic', 'Inter', sans-serif; }
  [dir="rtl"] *:not(.material-symbols-outlined) {
    font-family: 'Noto Naskh Arabic', 'Inter', sans-serif !important;
  }
  [dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3 { line-height: 1.4 !important; }
  input::placeholder { color: #9aa3b2; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  * { scrollbar-width: none; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes blink { 0%, 100% { opacity: 0.3; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }
  #stage { transform-origin: center center; transition: transform .15s ease; }
</style>
</head>
<body>
<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" fill="#0f4c81"/>
    <path d="M20 64 L40 40 L54 56 L66 38 L80 64 Z" fill="#f8fafc" opacity="0.95"/>
    <circle cx="50" cy="26" r="7" fill="#f59e0b"/>
  </svg>
</template>

<div id="stage"><div id="root"></div></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="android-frame.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="features.jsx"></script>
<script type="text/babel" src="screens-home.jsx"></script>
<script type="text/babel" src="screens-sections.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

<script type="text/babel" data-presets="react">
  function Root() {
    return (
      <window.AndroidDevice>
        <window.App />
      </window.AndroidDevice>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Root />);

  // scale the fixed-size phone to fit any viewport
  function fit() {
    const stage = document.getElementById("stage");
    const w = 412 + 16, h = 892 + 16;
    const s = Math.min(1, (window.innerWidth - 32) / w, (window.innerHeight - 32) / h);
    stage.style.transform = `scale(${s})`;
  }
  window.addEventListener("resize", fit);
  setTimeout(fit, 60);
</script>
</body>
</html>

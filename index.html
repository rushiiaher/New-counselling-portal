<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>District Counseling &amp; Career Portal — Anantnag, J&amp;K</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #141a26;
    font-family: 'Inter', system-ui, sans-serif;
    overflow: hidden;
  }
  #root { height: 100vh; }
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-weight: normal; font-style: normal; line-height: 1;
    letter-spacing: normal; text-transform: none; display: inline-block;
    white-space: nowrap; word-wrap: normal; direction: ltr;
    font-feature-settings: 'liga' 1; -webkit-font-feature-settings: 'liga' 1;
    -moz-font-feature-settings: 'liga'; font-variation-settings: 'opsz' 24;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  [dir="rtl"] *:not(.material-symbols-outlined) {
    font-family: 'Noto Naskh Arabic', 'Inter', sans-serif !important;
  }
  [dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3 { line-height: 1.4 !important; }
  input::placeholder, textarea::placeholder { color: #9aa3b2; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(15,76,129,0.2); border-radius: 99px; }
  ::-webkit-scrollbar-track { background: transparent; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes blink { 0%, 100% { opacity: 0.3; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }
</style>
</head>
<body>
<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" fill="#00355f"/>
    <circle cx="50" cy="38" r="15" fill="#f59e0b"/>
    <path d="M24 78 q26 -22 52 0 Z" fill="#f8fafc"/>
  </svg>
</template>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- device frame + design system -->
<script type="text/babel" src="android-frame.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="features.jsx"></script>

<!-- shared live store (sync spine) -->
<script type="text/babel" src="portal-store.jsx"></script>

<!-- student app -->
<script type="text/babel" src="screens-home.jsx"></script>
<script type="text/babel" src="screens-sections.jsx"></script>
<script type="text/babel" src="student-counselling.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

<!-- portal entry + role dashboards -->
<script type="text/babel" src="desk-shell.jsx"></script>
<script type="text/babel" src="portal-auth.jsx"></script>
<script type="text/babel" src="landing.jsx"></script>
<script type="text/babel" src="desk-counsellor.jsx"></script>
<script type="text/babel" src="desk-center.jsx"></script>
<script type="text/babel" src="desk-admin.jsx"></script>
<script type="text/babel" src="portal.jsx"></script>

<script type="text/babel" data-presets="react">
  ReactDOM.createRoot(document.getElementById("root")).render(<window.Portal />);
</script>
</body>
</html>
